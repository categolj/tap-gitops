apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: hello-golang
  annotations:
    ootb.apps.tanzu.vmware.com/servicebinding-workload: "true"
    ootb.apps.tanzu.vmware.com/apidescriptor-ref: "true"
    kapp.k14s.io/change-rule: upsert after upserting servicebinding.io/ServiceBindings
  labels:
    app.kubernetes.io/part-of: hello-golang
    apps.tanzu.vmware.com/has-tests: "true"
    apps.tanzu.vmware.com/workload-type: web
    app.kubernetes.io/component: run
    carto.run/workload-name: hello-golang
spec:
  template:
    metadata:
      annotations:
        apps.tanzu.vmware.com/correlationid: https://github.com/making/hello-golang?sub_path=/
        conventions.carto.run/applied-conventions: |-
          inspect-image-convention/buildpacks
          inspect-image-convention/base-image
          inspect-image-convention/run-image
          inspect-image-convention/source
          spring-boot-convention/auto-configure-actuators-check
          spring-boot-convention/is-native-app-check
          spring-boot-convention/is-prometheus-enabled-check
          spring-boot-convention/app-live-view-appflavour-check
        developer.conventions/target-containers: workload
        inspect-image.buildpacks.io/base-image: |-
          reference: registry.tanzu.vmware.com/build-service-dependency-updater/package-repo@sha256:b443aeedf2efe93f03062fd8d30a04b23acbe76f782238be3302487742366568
          top_layer: sha256:0b1edee84e9934ebd277a51b5b2aee4d9140e584d5b629de5840d6911039bce3
        inspect-image.buildpacks.io/buildpacks: |-
          - id: tanzu-buildpacks/ca-certificates
            version: 3.7.2
          - id: tanzu-buildpacks/go-dist
            version: 2.6.9
          - id: paketo-buildpacks/git
            version: 1.0.8
          - id: tanzu-buildpacks/go-mod-vendor
            version: 1.2.11
          - id: tanzu-buildpacks/go-build
            version: 2.3.2
          - id: tanzu-buildpacks/image-labels
            version: 4.6.2
        inspect-image.buildpacks.io/run-image: registry.tanzu.vmware.com/build-service-dependency-updater/package-repo@sha256:b443aeedf2efe93f03062fd8d30a04b23acbe76f782238be3302487742366568
        inspect-image.opencontainers.org/source: master@sha1:e9c5937c099b3e55d791c0db798a66209704f58e
      labels:
        app.kubernetes.io/component: run
        app.kubernetes.io/part-of: hello-golang
        apps.tanzu.vmware.com/has-tests: "true"
        apps.tanzu.vmware.com/workload-type: web
        carto.run/workload-name: hello-golang
    spec:
      containers:
      - image: ghcr.io/making/supply-chain/hello-golang-demo@sha256:9859f6ace75d3e7cb3827c1d7cf110e2b0f52faaadda0bbba5fbfd3d5f4cd231
        name: workload
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
      serviceAccountName: default

