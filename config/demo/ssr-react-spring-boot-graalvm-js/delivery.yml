apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ssr-react-spring-boot-graalvm-js
  annotations:
    ootb.apps.tanzu.vmware.com/servicebinding-workload: "true"
    ootb.apps.tanzu.vmware.com/apidescriptor-ref: "true"
    kapp.k14s.io/change-rule: upsert after upserting servicebinding.io/ServiceBindings
  labels:
    apps.tanzu.vmware.com/workload-type: web
    app.kubernetes.io/component: run
    carto.run/workload-name: ssr-react-spring-boot-graalvm-js
spec:
  template:
    metadata:
      annotations:
        apps.tanzu.vmware.com/correlationid: ghcr.io/making/ssr-react-spring-boot-graalvm-js
        conventions.carto.run/applied-conventions: |-
          inspect-image-convention/buildpacks
          inspect-image-convention/base-image
          inspect-image-convention/run-image
          inspect-image-convention/source
          spring-boot-convention/auto-configure-actuators-check
          spring-boot-convention/is-native-app-check
          spring-boot-convention/is-prometheus-enabled-check
          spring-boot-convention/app-live-view-appflavour-check
        developer.conventions/target-containers: workload
        inspect-image.buildpacks.io/base-image: |-
          reference: index.docker.io/paketobuildpacks/run-jammy-tiny@sha256:3bc0a6c2c3d66edb23c22d1edb22e30be5ab269c08392a2e8e123f184cbb8a2b
          top_layer: sha256:61bcd9591b393cafe4b3633b070577d3ef88961ca5ca7552f12744a0c13e15ff
        inspect-image.buildpacks.io/buildpacks: |-
          - id: paketo-buildpacks/image-labels
            version: 4.6.0
          - id: paketo-buildpacks/procfile
            version: 5.8.0
        inspect-image.buildpacks.io/run-image: index.docker.io/paketobuildpacks/run-jammy-tiny:latest
        inspect-image.opencontainers.org/source: main@sha1:f8656637ba780ae8e41df9a9da9b9eedac5c8b84
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
        prometheus.io/scrape: "true"
      labels:
        app.kubernetes.io/component: run
        apps.tanzu.vmware.com/workload-type: web
        carto.run/workload-name: ssr-react-spring-boot-graalvm-js
    spec:
      containers:
      - env:
        - name: MANAGEMENT_OTLP_TRACING_ENDPOINT
          value: http://otel-collector.opentelemetry.svc.cluster.local:4318/v1/traces
        - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
          value: "1.0"
        image: ghcr.io/making/ssr-react-spring-boot-graalvm-js@sha256:8275159d16af2980650ff87c62bea4e778101f7a952e54daeb230a4662935c2a
        name: workload
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
      serviceAccountName: default

