apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: zipkin
  annotations:
    ootb.apps.tanzu.vmware.com/servicebinding-workload: "true"
    ootb.apps.tanzu.vmware.com/apidescriptor-ref: "true"
    kapp.k14s.io/change-rule: upsert after upserting servicebinding.io/ServiceBindings
  labels:
    app.kubernetes.io/part-of: zipkin
    apps.tanzu.vmware.com/workload-type: web
    app.kubernetes.io/component: run
    carto.run/workload-name: zipkin
spec:
  template:
    metadata:
      annotations:
        apps.tanzu.vmware.com/correlationid: ghcr.io/making/openzipkin/zipkin-slim
        autoscaling.knative.dev/minScale: "1"
        conventions.carto.run/applied-conventions: |-
          spring-boot-convention/auto-configure-actuators-check
          spring-boot-convention/is-native-app-check
          spring-boot-convention/is-prometheus-enabled-check
          spring-boot-convention/app-live-view-appflavour-check
        developer.conventions/target-containers: workload
      labels:
        app.kubernetes.io/component: run
        app.kubernetes.io/part-of: zipkin
        apps.tanzu.vmware.com/workload-type: web
        carto.run/workload-name: zipkin
    spec:
      containers:
      - env:
        - name: SERVER_PORT
          value: "8080"
        - name: MEM_MAX_SPANS
          value: "5000"
        image: ghcr.io/making/openzipkin/zipkin-slim@sha256:04960098c64c199a28f95dc62252acd6f024caf5cd907b88ed91ef05b51df667
        name: workload
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
      serviceAccountName: default

